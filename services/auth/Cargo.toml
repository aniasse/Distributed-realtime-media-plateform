[package]
name = "auth"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "=4.9.0"
actix-rt = "=2.10.0"
actix-http = "=3.9.0"
jsonwebtoken = "8.0"
bcrypt = "0.15.0"
sqlx = { version = "0.6", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }
log = "0.4"
chrono = { version = "=0.4.38", features = ["serde"] }
time = "=0.3.36"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "=1.11.0", features = ["v4", "serde"] }
env_logger = "0.9"
tokio = { version = "1.0", features = ["full"] }
getrandom = "0.2.15"

[dependencies.shared]
path = "../../shared"

[[bin]]
name = "drmp-auth"
path = "src/main.rs"
