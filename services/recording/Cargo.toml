[package]
name = "recording"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
tokio-util = "0.7"
bytes = "1.0"
log = "0.4"
actix-web = "=4.9.0"
actix-rt = "=2.10.0"
actix-http = "=3.9.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "=1.11.0", features = ["v4", "serde"] }
chrono = { version = "=0.4.38", features = ["serde"] }
sqlx = { version = "0.6", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }
env_logger = "0.9"
async-trait = "0.1"
bincode = "1.3"

[dependencies.shared]
path = "../../shared"

[[bin]]
name = "drmp-recording"
path = "src/main.rs"
