[package]
name = "sfu"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
tokio-util = "0.7"
bytes = "1.0"
log = "0.4"
actix = "0.13"
actix-web = "4.0"
actix-rt = "2.0"
actix-http = "3.0"
actix-web-actors = "4.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
time = "0.3"
sqlx = { version = "0.6", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }
dashmap = "5.0"
futures = "0.3"
env_logger = "0.9"
webrtc = "0.11"

[dependencies.shared]
path = "../../shared"

[lib]
name = "sfu"
path = "src/lib.rs"

[[bin]]
name = "drmp-sfu"
path = "src/main.rs"
